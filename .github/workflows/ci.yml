name: CI

on:
  push:
    branches: [dev, main, hard-reset]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: briefs
          POSTGRES_PASSWORD: briefs
          POSTGRES_DB: briefs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U briefs -d briefs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BRIEFS_DATABASE_URL: postgresql://briefs:briefs@localhost:5432/briefs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
