name: brief

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brief
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: brief
    volumes:
      - brief-postgres:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brief -d brief"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - brief-redis:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  brief:
    image: ${BRIEF_IMAGE:?BRIEF_IMAGE is required for production deploys}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BRIEF_HOST: 0.0.0.0
      BRIEF_PORT: 8000
      BRIEF_REDIS_URL: redis://redis:6379
    secrets:
      - database_url
      - auth_admin_secret
      - mcp_static_tokens
    ports:
      - "127.0.0.1:${BRIEF_PORT:-8000}:8000"
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${BRIEF_WEB_IMAGE:?BRIEF_WEB_IMAGE is required for production deploys}
    restart: unless-stopped
    environment:
      BRIEF_API_URL: http://brief:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${BRIEF_WEB_PORT:-3100}:3000"
    networks:
      - private
    depends_on:
      brief:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  private:
    driver: bridge

volumes:
  brief-postgres:
  brief-redis:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  auth_admin_secret:
    file: ./secrets/auth_admin_secret
  mcp_static_tokens:
    file: ./secrets/mcp_static_tokens
