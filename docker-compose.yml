name: brief

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brief
      POSTGRES_PASSWORD: brief
      POSTGRES_DB: brief
    ports:
      - "5432:5432"
    volumes:
      - brief-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brief -d brief"]
      interval: 5s
      timeout: 5s
      retries: 10

  system:
    build: .
    ports:
      - "${BRIEF_PORT:-8000}:8000"
    environment:
      BRIEF_ENV: development
      BRIEF_HOST: 0.0.0.0
      BRIEF_PORT: 8000
      BRIEF_DATABASE_URL: postgresql://brief:brief@postgres:5432/brief
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  brief-postgres:
