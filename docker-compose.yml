name: brief

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brief
      POSTGRES_PASSWORD: brief
      POSTGRES_DB: brief
    ports:
      - "5432:5432"
    volumes:
      - brief-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brief -d brief"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - brief-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  brief:
    build: .
    ports:
      - "${BRIEF_PORT:-8000}:8000"
    environment:
      BRIEF_ENV: ${BRIEF_ENV:-development}
      BRIEF_HOST: 0.0.0.0
      BRIEF_PORT: 8000
      BRIEF_PUBLIC_URL: ${BRIEF_PUBLIC_URL:-http://localhost:8000}
      BRIEF_DATABASE_URL: postgresql://brief:brief@postgres:5432/brief
      BRIEF_REDIS_URL: redis://redis:6379
      BRIEF_GRAPH_CACHE_TTL_SECONDS: ${BRIEF_GRAPH_CACHE_TTL_SECONDS:-60}
      BRIEF_MCP_AUTH_DISABLED: ${BRIEF_MCP_AUTH_DISABLED:-true}
      BRIEF_AUTH_ADMIN_SECRET: ${BRIEF_AUTH_ADMIN_SECRET:-}
      BRIEF_MCP_STATIC_TOKENS: ${BRIEF_MCP_STATIC_TOKENS:-}
      BRIEF_ALLOWED_HOSTS: brief,brief:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        BRIEF_API_URL: http://brief:8000
    ports:
      - "${BRIEF_WEB_PORT:-3100}:3000"
    environment:
      BRIEF_API_URL: http://brief:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      brief:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  brief-postgres:
  brief-redis:
