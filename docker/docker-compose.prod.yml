name: briefs

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefs
      POSTGRES_DB: briefs
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - briefs-postgres:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefs -d briefs"]
      interval: 10s
      timeout: 5s
      retries: 5

  system:
    image: ${SYSTEM_IMAGE:?SYSTEM_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    secrets:
      - database_url
      - auth_secret
      - resend_api_key
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp:
    image: ${MCP_IMAGE:?MCP_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    environment:
      API_URL: http://system:8000
      AUTH_SECRET_FILE: /run/secrets/auth_secret
    ports:
      - "127.0.0.1:${MCP_PORT:-3334}:3334"
    secrets:
      - auth_secret
    networks:
      - private
    depends_on:
      system:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3334/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  flight:
    image: ${FLIGHT_IMAGE:?FLIGHT_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    environment:
      API_URL: http://system:8000
      SESSION_SECRET_FILE: /run/secrets/session_secret
      FLIGHT_REDIS_HOST: redis
      FLIGHT_REDIS_PORT: 6379
      FLIGHT_MODE: production
      FLIGHT_TRUST_PROXY: "true"
      FLIGHT_DISABLE_VITE: "true"
      FLIGHT_DIST_PATH: dist
      FLIGHT_PORT: 3100
      FLIGHT_MAX_WORKERS: ${FLIGHT_MAX_WORKERS:-2}
    ports:
      - "127.0.0.1:${FLIGHT_PORT:-3100}:3100"
    secrets:
      - session_secret
    networks:
      - private
    depends_on:
      system:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/api/flight/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - private
    depends_on:
      flight:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  private:
    driver: bridge

volumes:
  briefs-postgres:
  caddy-data:
  caddy-config:

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password
  database_url:
    file: ${SECRETS_DIR:-./secrets}/database_url
  auth_secret:
    file: ${SECRETS_DIR:-./secrets}/auth_secret
  session_secret:
    file: ${SECRETS_DIR:-./secrets}/session_secret
  resend_api_key:
    file: ${SECRETS_DIR:-./secrets}/resend_api_key
