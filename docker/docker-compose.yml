name: briefs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: briefs
      POSTGRES_PASSWORD: briefs
      POSTGRES_DB: briefs
    ports:
      - "5432:5432"
    volumes:
      - briefs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefs -d briefs"]
      interval: 5s
      timeout: 5s
      retries: 10

  system:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${BRIEFS_PORT:-8001}:8000"
    environment:
      BRIEFS_ENV: development
      BRIEFS_HOST: 0.0.0.0
      BRIEFS_PORT: 8000
      BRIEFS_DATABASE_URL: postgresql://briefs:briefs@postgres:5432/briefs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    ports:
      - "${BRIEFS_MCP_PORT:-3334}:3334"
    environment:
      BRIEFS_MCP_PORT: 3334
      BRIEFS_API_URL: http://system:8000
      BRIEFS_MCP_DEV_SKIP_AUTH: ${BRIEFS_MCP_DEV_SKIP_AUTH:-true}
      BRIEFS_OAUTH_ISSUER: ${BRIEFS_OAUTH_ISSUER:-http://system:8000/oauth}
      BRIEFS_AUTH_SECRET: ${BRIEFS_AUTH_SECRET:-dev-briefs-auth-secret}
    depends_on:
      system:
        condition: service_healthy

  daily:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daily
      args:
        NEXT_PUBLIC_BRIEFS_API_URL: ${NEXT_PUBLIC_BRIEFS_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_BRIEFS_MCP_URL: ${NEXT_PUBLIC_BRIEFS_MCP_URL:-http://localhost:3334/mcp}
    ports:
      - "${BRIEFS_DAILY_PORT:-3000}:3000"
    environment:
      BRIEFS_API_URL: http://system:8000
      BRIEFS_OAUTH_ISSUER: ${BRIEFS_OAUTH_ISSUER:-http://localhost:8001/oauth}
      BRIEFS_SESSION_SECRET: ${BRIEFS_SESSION_SECRET:-dev-briefs-daily-session-secret}
      BRIEFS_DEV_USER_ID: ${BRIEFS_DEV_USER_ID:-demo}
      BRIEFS_APP_URL: ${BRIEFS_APP_URL:-http://localhost:3000}
    depends_on:
      system:
        condition: service_healthy
      mcp:
        condition: service_healthy

volumes:
  briefs-postgres:
