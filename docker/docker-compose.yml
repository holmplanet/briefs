name: briefs

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: briefs
      POSTGRES_PASSWORD: briefs
      POSTGRES_DB: briefs
    ports:
      - "5432:5432"
    volumes:
      - briefs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefs -d briefs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  system:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql://briefs:briefs@postgres:5432/briefs}
      API_DEV_BYPASS: ${API_DEV_BYPASS:-true}
      AUTH_SECRET: ${AUTH_SECRET:-dev-briefs-auth-secret}
      OAUTH_ISSUER: ${OAUTH_ISSUER-http://localhost:8001/oauth}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-briefs-flight}
      OAUTH_REDIRECT_URIS: ${OAUTH_REDIRECT_URIS-http://localhost:3100/auth/callback}
      OTP_MAILER: ${OTP_MAILER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY-}
      EMAIL_FROM: ${EMAIL_FROM-}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    ports:
      - "${MCP_PORT:-3334}:3334"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MCP_PORT: 3334
      API_URL: http://system:8000
      MCP_DEV_SKIP_AUTH: ${MCP_DEV_SKIP_AUTH:-true}
      OAUTH_ISSUER: ${OAUTH_ISSUER-http://system:8000/oauth}
      AUTH_SECRET: ${AUTH_SECRET:-dev-briefs-auth-secret}
    depends_on:
      system:
        condition: service_healthy

  flight:
    build:
      context: ..
      dockerfile: docker/Dockerfile.flight
    ports:
      - "${FLIGHT_PORT:-3100}:3100"
    environment:
      API_URL: http://system:8000
      APP_ENV: ${APP_ENV:-development}
      NODE_ENV: ${NODE_ENV:-development}
      OAUTH_ISSUER: ${OAUTH_ISSUER-http://system:8000/oauth}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-briefs-flight}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-briefs-flight-session-secret}
      APP_URL: ${APP_URL:-http://localhost:3100}
      FLIGHT_PORT: 3100
      FLIGHT_TRUST_PROXY: "false"
    depends_on:
      system:
        condition: service_healthy
      mcp:
        condition: service_healthy

volumes:
  briefs-postgres:
